name: Train Proposed GAP-CNN

on:
  workflow_dispatch:
    inputs:
      data_root:
        description: Absolute path to ICCAD dataset root on the self-hosted runner (contains iccad1..iccad5)
        required: true
        type: string
      benchmarks:
        description: Space-separated benchmark IDs (for example 1 or 1 2 3 4 5)
        required: true
        default: "1"
        type: string
      epochs:
        description: Training epochs per benchmark
        required: true
        default: "10"
        type: string
      image_size:
        description: Input resolution (notebook default is 64)
        required: true
        default: "64"
        type: string
      seed:
        description: Random seed
        required: true
        default: "42"
        type: string

permissions:
  contents: read

jobs:
  train:
    # Register a GPU-capable machine as a GitHub Actions self-hosted runner.
    # Install PyTorch/torchvision compatible with that machine before running.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python and GPU
        shell: bash
        run: |
          python3 --version
          python3 - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("GPU:", torch.cuda.get_device_name(0))
          PY

      - name: Install training dependencies
        run: python3 -m pip install --upgrade numpy pillow matplotlib scikit-learn

      - name: Validate dataset structure
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          BENCHMARKS: ${{ inputs.benchmarks }}
        shell: bash
        run: |
          set -euo pipefail
          for b in $BENCHMARKS; do
            for d in "$DATA_ROOT/iccad$b/train/train_hs" "$DATA_ROOT/iccad$b/train/train_nhs" "$DATA_ROOT/iccad$b/test/test_hs" "$DATA_ROOT/iccad$b/test/test_nhs"; do
              test -d "$d" || { echo "::error::Missing dataset directory: $d"; exit 1; }
            done
          done

      - name: Train, evaluate, and generate explanations
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          BENCHMARKS: ${{ inputs.benchmarks }}
          EPOCHS: ${{ inputs.epochs }}
          IMAGE_SIZE: ${{ inputs.image_size }}
          SEED: ${{ inputs.seed }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m src.train_proposed_gap \
            --data-root "$DATA_ROOT" \
            --output-dir artifacts/proposed_gap \
            --benchmarks $BENCHMARKS \
            --epochs "$EPOCHS" \
            --image-size "$IMAGE_SIZE" \
            --seed "$SEED"

      - name: Upload checkpoints, metrics, and explanation maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proposed-gap-cnn-${{ github.run_number }}
          path: artifacts/proposed_gap/
          if-no-files-found: warn
          retention-days: 30
